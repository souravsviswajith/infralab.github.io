<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InfraLab</title>
  <meta name="description" content="Web application migrated from souravsviswajith/infralab.github.io." />
  <meta property="og:title" content="InfraLab" />
  <meta property="og:description" content="Web application migrated from souravsviswajith/infralab.github.io." />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fafafa;
      --fg: #18181b;
      --muted: #52525b;
      --border: #e4e4e7;
      --card: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --border: #27272a;
        --card: #18181b;
      }
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
    }
    main {
      width: 100%;
      max-width: 640px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 16px;
      color: var(--muted);
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9em;
      padding: 2px 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    a {
      color: var(--fg);
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <h1>InfraLab</h1>
    <p>
      Imported from <code>souravsviswajith/infralab.github.io</code>.
    </p>
    <p>
      The imported repository contained only <code>LICENSE</code> (Apache License 2.0) and no HTML or application source files yet. Add your site files or describe what you want to build next.
    </p>
    <p>
      <a href="/LICENSE">View LICENSE</a>
    </p>
  </main>
</body>
</html>
